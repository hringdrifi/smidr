<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#f59e0b" />
    <title>Smiðr - Custom Keyboard Forge</title>
    <meta name="description" content="A premium, web-based tool for designing and configuring custom keyboard physical layouts." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('smidr_theme');
          if (t === 'light' || t === 'dark') document.documentElement.classList.add(t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-[#09090b] text-[#fafafa]">
    <div id="root" class="flex-1 flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
